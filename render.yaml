services:
  - type: web
    name: call-safety-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 demo/server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-transcribe
      - key: OPENAI_MODERATION_MODEL
        value: omni-moderation-latest
      - key: PYTHONUNBUFFERED
        value: "1"
